<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Mateen Online Store</title>

  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="stylesheet" href="/css/global.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #f9fafb 50%, #ecfdf5 100%);
      color: #111827;
    }

    .nf-wrapper {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      border-radius: 24px;
      padding: 48px 32px 40px;
      box-shadow:
        0 20px 50px rgba(22, 163, 74, 0.08),
        0 4px 12px rgba(0, 0, 0, 0.04);
      border: 1px solid #e5e7eb;
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .nf-code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #16a34a, #15803d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -4px;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    .nf-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
      opacity: 0.7;
    }

    .nf-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }

    .nf-desc {
      font-size: 1rem;
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .nf-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nf-btn {
      padding: 13px 26px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 2px solid transparent;
    }

    .nf-btn-primary {
      background: #16a34a;
      color: #ffffff;
      border-color: #16a34a;
    }

    .nf-btn-primary:hover {
      background: #15803d;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.3);
    }

    .nf-btn-outline {
      background: transparent;
      color: #16a34a;
      border-color: #16a34a;
    }

    .nf-btn-outline:hover {
      background: #f0fdf4;
      transform: translateY(-2px);
    }

    .nf-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #f3f4f6;
      font-size: 0.82rem;
      color: #9ca3af;
    }

    .nf-footer a {
      color: #16a34a;
      text-decoration: none;
      font-weight: 600;
    }

    .nf-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .nf-wrapper { padding: 36px 20px 28px; }
      .nf-code { font-size: 4.5rem; }
      .nf-title { font-size: 1.3rem; }
      .nf-btn { width: 100%; justify-content: center; }
      .nf-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="nf-wrapper">

    <div class="nf-icon">🔍</div>

    <div class="nf-code">404</div>

    <h1 class="nf-title">Page Not Found</h1>

    <p class="nf-desc">
      The page you're looking for doesn't exist, was moved, or is temporarily unavailable.
    </p>

    <div class="nf-actions">
      <a href="/index.html" class="nf-btn nf-btn-primary">
        🏠 Go to Home
      </a>
      <a href="/pages/products.html" class="nf-btn nf-btn-outline">
        🛍️ Browse Products
      </a>
    </div>

    <p class="nf-footer">
      Need help? <a href="/pages/contact.html">Contact Support</a>
    </p>

  </div>

</body>
</html>
